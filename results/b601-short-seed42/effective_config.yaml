_target_: real_robot.workspace.TrainB601Workspace
name: train_diffusion_unet_hybrid
exp_name: b601_short
task_name: b601_image
horizon: 16
n_obs_steps: 2
dataset_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
obs_as_global_cond: true
past_action_visible: false
shape_meta:
  action:
    shape:
    - 7
  obs:
    image:
      shape:
      - 3
      - 240
      - 320
      type: rgb
    joint_pos:
      shape:
      - 7
      type: low_dim
task:
  name: b601_image
  shape_meta:
    action:
      shape:
      - 7
    obs:
      image:
        shape:
        - 3
        - 240
        - 320
        type: rgb
      joint_pos:
        shape:
        - 7
        type: low_dim
  dataset:
    _target_: real_robot.dataset.B601ImageDataset
    zarr_path: data/b601/merged/demonstrations.zarr
    selection_path: results/b601-data-check/review/training_candidates.json
    split_path: data/b601/merged/split-seed42.json
    horizon: 16
    n_obs_steps: 2
    pad_before: 1
    pad_after: 7
  env_runner:
    _target_: real_robot.offline_runner.OfflineImageRunner
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  shape_meta:
    action:
      shape:
      - 7
    obs:
      image:
        shape:
        - 3
        - 240
        - 320
        type: rgb
      joint_pos:
        shape:
        - 7
        type: low_dim
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: 16
  n_action_steps: 8
  n_obs_steps: 2
  num_inference_steps: 100
  obs_as_global_cond: true
  crop_shape: null
  diffusion_step_embed_dim: 128
  down_dims:
  - 128
  - 256
  - 512
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  obs_encoder_group_norm: true
  eval_fixed_crop: false
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
dataloader:
  batch_size: 8
  num_workers: 2
  shuffle: true
  pin_memory: true
  persistent_workers: false
val_dataloader:
  batch_size: 8
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: false
training:
  device: cuda:0
  seed: 42
  resume: false
  use_ema: true
  num_epochs: 3
  max_train_steps: 50
  max_val_steps: 16
  gradient_accumulate_every: 1
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 10
  rollout_every: 1
  val_every: 1
  sample_every: 1
  checkpoint_every: 1
  debug: false
  tqdm_interval_sec: 1.0
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: val_loss
    mode: min
    k: 3
    format_str: epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt
logging:
  mode: disabled
  project: diffusion_policy_b601
  name: b601_offline
  group: null
  id: null
  resume: false
  tags:
  - b601_image
  - offline
